schema: symplectic-stafford-release-gates/v1
target: SS-all-original-affine
paper_commit: 502b65a1dea53cac52220a08e321bfba525bc72e
instructions_commit: e3c7077d3d51772d97d8e72bb219a8fc36765682
project_owned_obligations: [M01, M02, M03, M04, M05, M06, M07, M08, M09, M10, M11]
checkpoint_comparator_is_terminal_evidence: false
# These lists specify the evidence required by the human release review. The
# readiness script fail-closes on publication.enabled, the target, matching
# phase/result labels, and a pass result for every listed check. Human review
# of terminal correspondence, source identity and comparator scope remains
# required even when the executable metadata gate passes.
phases:
  phase_i:
    status: pending
    evidence: evidence/phase-i.yaml
    required_checks: [terminal-statement-correspondence, project-owned-obligation-closure, literature-leaf-audit, clean-independent-replay, lean-build, independent-behavioral-tests]
  phase_ii:
    status: pending
    evidence: evidence/phase-ii.yaml
    required_checks: [terminal-statement-correspondence, allowed-axiom-closure, clean-independent-replay, lean-build, independent-behavioral-tests, independent-kernel-replay]
  palomar:
    status: pending
    evidence: evidence/palomar.yaml
    required_checks: [terminal-statement-comparison, compatibility-build, compatibility-tests, independent-kernel-replay]
publication:
  enabled: false
  required_phases: [phase_i, phase_ii, palomar]
  gate: scripts/check-release-readiness.sh
