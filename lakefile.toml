name = "symplecticStaffordFormal"
version = "0.1.0"
defaultTargets = ["SymplecticStafford.Paper", "Challenge", "Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "c55e6e786f49471c72fbddbec5415808896aec1e"

[[lean_lib]]
name = "SymplecticStafford"
globs = ["SymplecticStafford.*"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "tests"
globs = ["tests.+"]
