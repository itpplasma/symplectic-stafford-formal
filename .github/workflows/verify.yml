name: Verify formalization

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' &&
      ((github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake --version
      - name: Check disk and temporary filesystem headroom
        run: ./scripts/check-resources.sh
      - name: Fetch the pinned Mathlib cache
        run: lake exe cache get
      - name: Check verification guard regressions
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Replay complete current Target A contract
        run: ./scripts/verify.sh full
      - name: Install release metadata parser
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -m pip install PyYAML
      - name: Print verification diagnostics on failure
        if: failure()
        shell: bash
        run: |
          for log in .lake/verification/*.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 40 "$log"
            echo "::endgroup::"
          done
      - name: Check publication evidence (fail closed)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/check-release-readiness.sh
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-a-verification
          path: .lake/verification/
