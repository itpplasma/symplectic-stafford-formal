name: Verify formalization

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned Lean toolchain
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake --version
      - name: Check disk and temporary filesystem headroom
        run: ./scripts/check-resources.sh
      - name: Fetch the pinned Mathlib cache
        run: lake exe cache get
      - name: Install release metadata parser
        run: python3 -m pip install PyYAML
      - name: Check verification guard regressions
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'
      - name: Replay complete current Target A contract
        run: ./scripts/verify.sh full
      - name: Check publication evidence (fail closed)
        if: startsWith(github.ref, 'refs/tags/')
        run: ./scripts/check-release-readiness.sh
      - name: Retain verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: target-a-verification
          path: .lake/verification/
