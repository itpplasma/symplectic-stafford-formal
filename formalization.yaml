version: "v0.4"

project:
  name: "Finite central division pencils (Symplectic Stafford checkpoint)"
  description: >-
    The selected Challenge/Solution states that an affine pencil beginning
    at a linearly independent finite tuple over a division ring has only
    finitely many bad central scalars, when the division ring is finite
    dimensional over the infinite central field. Scalar compatibility is
    explicit. The solution uses the checked finite-spectrum proof in
    FiniteCentralDivisionLLD. The surrounding repository develops the
    symplectic Stafford programme; its universal same-divisor theorem and
    all-dimensional project-owned producers remain open. This bounded
    comparison does not assert their completion or claim research novelty.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/symplectic-stafford-formal"
  registration_status: "private-development-not-registered"
  note: >-
    This is a development checkpoint. Visibility, Palomar submission, and
    any Zenodo deposit are separate human release decisions after the gates in
    release-gates.yaml pass.

