# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Symplectic Stafford: the affine same-divisor theorem"
  description: >-
    A complete Lean 4 proof of Target theorem A of the Symplectic Stafford
    manuscript. Let U be a simple, infinite-dimensional algebra over a field
    of characteristic zero, with an exhaustive nonnegative multiplicative
    filtration by finite-dimensional pieces, F_0 U = k, and associated graded
    ring a commutative affine domain of finite Krull dimension. Then for all
    nonzero d, a and every B in U there are H, R, S with
    1 = dR + (B + Ha)dS. The development also proves the left-handed
    identity and the module-theoretic consequences of the manuscript's
    section 7 for U. No novelty or priority claim is made.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/symplectic-stafford-formal"
  registration_status: "private-development-not-registered"
  note: >-
    This is a development checkpoint. Visibility, Palomar submission, and
    any Zenodo deposit are separate human release decisions after the gates in
    release-gates.yaml pass.

classification:
  arxiv:
    - "math.RA"
    - "math.AG"
  msc2020:
    - "16S32"
    - "16S38"

sources:
  - title: "Original Symplectic Stafford proof development"
    authors:
      - name: "Christopher Albert"
        orcid: "0000-0003-4773-416X"
    type: "original-proof"
    relationship: "other"
    location: "itpplasma/symplectic-stafford, commit 502b65a1dea53cac52220a08e321bfba525bc72e"
    note: >-
      The private Markdown exposition, working notes, and this Lean checkpoint
      are records of the same internal research development. The exposition is
      not a separately published or presented prior source being formalized.
      Its dated chronology is retained for provenance and mathematical review.
      This checkpoint makes no publication or priority claim and does not yet
      establish the universal theorem.
    license: "unknown"
    author_endorsement: "participated"
  - title: "Module structure of Weyl algebras"
    authors:
      - "J. T. Stafford"
    type: "paper"
    location: >-
      Journal of the London Mathematical Society (2) 18 (1978), 429--442,
      Conjecture 3.8
    relationship: "background"
    note: >-
      Historical source for the same-divisor target. The universal symplectic
      extension is not imported as a theorem by this checkpoint.

related_formalizations:
  - name: "Stafford 3.8"
    url: "https://github.com/itpplasma/stafford38-formal"
    relationship: "builds-on"
    note: >-
      Pinned public formal dependency used for the shared environment; it is
      not a mathematical source for the new symplectic proof development.

verification:
  report: "docs/target-a-submission-scope.md"
  machine_readable_report: "docs/verification-results.json"
  statement_correspondence: "docs/target-a-submission-scope.md"
  source_commit: "b80d925a"
  source_note: >-
    Paper repository itpplasma/symplectic-stafford: consolidated manuscript
    (edition of 30 September 2026), docs/zariskian-local-package-closure-2026-09-30.md
    and docs/formal-proof-route-2026-09-30.md.
  allowed_axioms: ["propext", "Classical.choice", "Quot.sound"]

status:
  scope: >-
    Target theorem A is formalized unconditionally. The Challenge/Solution
    pair states it with Mathlib-only definitions of the standing hypotheses.
    The proof development under SymplecticStafford/Paper imports Mathlib
    only. Local Comparator, NanoDa and Lean-kernel replays are recorded in
    docs/verification.md. Public clean replay, independent human review and
    registration remain release steps.
  sorry_count: 1
  sorry_note: "The single sorry is the statement-only placeholder in Challenge.lean."
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "SymplecticStaffordChallenge.universalStatement"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "SymplecticStafford.Paper.FilteredAlgebraData.targetA"
      file: "SymplecticStafford/Paper/Induction.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SymplecticStafford.Paper.FilteredAlgebraData.targetA_left"
      file: "SymplecticStafford/Paper/Opposite.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "SymplecticStafford.Paper.FilteredAlgebraData.cancellation"
      file: "SymplecticStafford/Paper/ConsequencesForU.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []

automation:
  methods:
    - method: "manual"
      framework: "Lean 4 and Mathlib"
      tool_setup: >-
        Human controller owns the plan, source comparison, integration, and
        release decision; Lean performs kernel checking and replay scripts
        provide independent behavioral consumers.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: "n/a"
    - method: "agent"
      models:
        - "gpt-5.6-luna"
        - "gpt-5.6-sol"
        - "gpt-6-astra"
      framework: "Codex"
      tool_setup: >-
        Bounded parallel agents supplied disjoint proof slices and audits; the
        controller integrated only checked changes.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local workstation"
      prompting_notes: >-
        Workers returned evidence; they did not promote phase status or release
        metadata.
  spend_usd: "not tracked"
  notes: "Automation assistance does not assign authorship of mathematical ideas."

fidelity:
  divergences: >-
    The formal statement encodes the manuscript's section 1.1 hypotheses
    exactly. The associated graded ring is given by surjective multiplicative
    symbol maps with the correct kernels. The formal proof shortens several
    arguments while keeping every statement; see the "Proof-route differences"
    section of docs/target-a-submission-scope.md. The Zariskian localization
    package is proved through a survival lemma in U rather than through
    localized Rees rings. Corollary 4.4 uses a maximal-rank argument in place
    of the sketched Lemma 4.3. Supports are computed over all primes of G.
    The legacy scaffolds outside SymplecticStafford/Paper are not used by the
    proof.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The statement correspondence and proof architecture await independent
    human review. The comparator result certifies that Solution proves
    exactly the Challenge statement with the permitted axioms.

alignment:
  namespace: "SymplecticStafford"
  statements:
    - source: "Internal proof target: ordered same-divisor certificate"
      lean: "SymplecticStafford.SameDivisorIdentity"
      module: "SymplecticStafford.Statement"
      status: "target-only"
      note: "The target is declared; no universal producer theorem is claimed."
    - source: "Semantic contract C01--C03"
      lean: "SymplecticStafford.original_membership_extraction"
      module: "SymplecticStafford.Semantics.Contract"
      status: "proved"
      note: "Original-ring membership and one-generation equivalences."
    - source: "Finite central division-pencil theorem"
      lean: "SymplecticStaffordChallenge.universalStatement"
      module: "Solution"
      status: "proved"
      note: "Finite bad central parameters for an initially independent tuple; bounded comparison, not the universal Stafford theorem."

acknowledgements: >-
  The workspace builds on Lean, Mathlib, AlgebraicAnalysis, and the pinned
  Stafford38 formal project. Comparator, lean4export, NanoDa, and Landrun
  provide the independent submission-checking path when the complete endpoint
  exists.
