version: "v0.4"

project:
  name: "Symplectic Stafford (semantic checkpoint)"
  description: >-
    Lean 4 formalization of the original-ring semantic and ordered-algebra
    interfaces for the symplectic Stafford same-divisor programme. The
    checkpoint proves right-ideal membership/extraction, the relation-respecting
    quotient right-action laws, original-ring central-support zero detection,
    support-boundary extraction, explicit opposite transport, ordered
    affine/common-colon/finite-generation identities and an ambient ordered
    common-colon producer, raw
    and algebraic filtered/Rees operations including a ring-valued bounded
    Rees object, quotient Rees-module actions,
    explicit power-Ore fractions and finite power-Ore normal forms,
    finite bounded-generator filtrations, finite-support and matrix-pencil
    detection, an associated-layer support proxy, explicit additive
    ring-filtration layers and associated classes with multiplication,
    a commutative regular-element full-symbol calibration, explicit right-module
    composition filtrations and Jacobson-top generation reflection, a
    spectrum-support boundary, a filtered Noetherianity boundary, a
    full-symbol algebraic localization and right-localized-module
    common-denominator boundary, and Rees-Noetherianity boundaries, a
    minimal-prime local finite-length core including an `AtPrime` support-
    dimension bridge, an actual module-support
    producer consumer, a list-indexed division-LLD source selector, an
    original-test producer
    boundary, activated finite-length/finite-orbit pencil consumption and a
    finite-central-dimension orbit-basis producer,
    a faithful weighted-detection boundary, an M08 support-union boundary,
    and strong-P_h and terminal obstructions,
    conditional differential-Ore/right-denominator clearing, constructive
    finite-index successor contracts, original-affine source selection,
    conditional support-union, an actual M08 right-Noetherian finite-generator
    producer, support-removal defect arithmetic, and
    conditional original-U finite-test/cyclic-pencil bridges, including a
    two-call affine-source constructor, a two-call descent successor
    constructor, an actual-right-localization power-Ore bridge, a finite
    weighted-matrix inverse/row-action lemma, and terminal/opposite package
    assembly, finite common-denominator clearing for right-localized families,
    weighted-detection composition after a nilpotent correction, a concrete
    central-field filtered-algebra interface, Jacobson scalar-extension top
    comparison, finite scalar bad-set avoidance, and indexed finite-colon
    characteristic-support consumption, an actual filtered-layer class/support
    bridge, finite full-symbol chart control, a module Noetherianity criterion
    with a sequence-ring obstruction, bounded below-one inverse data and a
    diagonal negative-degree matrix boundary, explicit finite composition and
    block consumers, certified nonzero original-U source selection, and indexed
    support-removal/test-retention consumption, proposition-only M01 and
    sequence-ring Noetherianity boundaries, the A1 principal-open/power-Ore
    obstruction, the full-symbol bounded-inverse boundary, explicit isotypic
    repeated-block data, and a source-dependent support-removal obstruction,
    degree-zero central-field and noncommutative associated-graded boundaries,
    finite-length radical-top extraction, division-ring eigenvalue boundaries,
    filtered full-symbol weighted boundaries, a degree-zero associated-layer
    equivalence, strict good-subquotient Noetherian consumers, a polynomial
    full-symbol calibration, finite weighted-faithful calibration, a
    zero-pencil division-ring obstruction, finite-direction original-U source
    selection, explicit base/two-call endpoint assembly, a polynomial
    filtration boundary, polynomial Rees-Noetherian certificate, finite
    actual-Ore clearing, a good polynomial-module calibration, split central
    finite-pencil activation, a Weyl A1 original-ring calibration, and a
    concrete Nat support-removal successor, an additive structural
    filtered-ring class, finite homogeneous Rees decomposition,
    localized-to-original cofactor recombination, generic weighted
    good-module detection, finite-central division-block pencils, a split
    finite-dimensional original-U source selector, and central-field
    support-removal/test-retention bridges, an associated-graded spectrum
    support bridge, a filtered-to-Rees Noetherian transfer criterion,
    localized divisor assembly, weighted support linkage, finite-central
    activated pencils, finite-dimensional same-divisor assembly, and a
    central-field two-call successor.
    General
    finite-length activated pencils and the universal
    source producer remain open. It does not claim
    the universal higher-dimensional source-selection or same-divisor theorem
    from the companion paper; those are explicit Phase I and Phase II gates.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

