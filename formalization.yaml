# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Symplectic Stafford (semantic checkpoint)"
  description: >-
    Lean 4 formalization of the original-ring semantic and ordered-algebra
    interfaces for the symplectic Stafford same-divisor programme. The
    checkpoint proves right-ideal membership/extraction, the relation-respecting
    quotient right-action laws, original-ring central-support zero detection,
    support-boundary extraction, explicit opposite transport, ordered
    affine/common-colon/finite-generation identities and an ambient ordered
    common-colon producer, raw
    and algebraic filtered/Rees operations, quotient Rees-module actions,
    explicit power-Ore fractions and finite power-Ore normal forms,
    finite bounded-generator filtrations, finite-support and matrix-pencil
    detection, an associated-layer support proxy, explicit additive
    ring-filtration layers and associated classes, explicit right-module
    composition filtrations and Jacobson-top generation reflection, a
    spectrum-support boundary, a filtered Noetherianity boundary, a
    full-symbol algebraic localization and right-localized-module
    common-denominator boundary, and Rees-Noetherianity boundaries, a
    minimal-prime local finite-length core, an actual module-support
    producer consumer, a list-indexed division-LLD source selector, an
    original-test producer
    boundary, and activated finite-length/finite-orbit pencil consumption,
    a faithful weighted-detection boundary, an M08 support-union boundary,
    and strong-P_h and terminal obstructions,
    conditional differential-Ore/right-denominator clearing, constructive
    finite-index successor contracts, original-affine source selection,
    conditional support-union, support-removal defect arithmetic, and
    conditional original-U finite-test/cyclic-pencil bridges. General
    finite-length activated pencils and the universal
    source producer remain open. It does not claim
    the universal higher-dimensional source-selection or same-divisor theorem
    from the companion paper; those are explicit Phase I and Phase II gates.
  authors:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  responsible_maintainers:
    - name: "Christopher Albert"
      orcid: "0000-0003-4773-416X"
  license: "Apache-2.0"

repository:
  role: "substantive-development"
  url: "https://github.com/itpplasma/symplectic-stafford-formal"
  registration_status: "private-development-not-registered"
  note: >-
    This is a development checkpoint. Visibility, Palomar submission, and
    any Zenodo deposit are separate human release decisions after the gates in
    release-gates.yaml pass.

