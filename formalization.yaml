fidelity:
  divergences: >-
    The formal statement encodes the manuscript's section 1.1 hypotheses
    exactly. The associated graded ring is given by surjective multiplicative
    symbol maps with the correct kernels. The formal proof establishes Target A and the recorded section 7
    consequences. It bypasses some intermediate manuscript claims rather than
    formalizing every manuscript lemma; see the claim-by-claim map and the
    "Proof-route differences" section of docs/target-a-submission-scope.md. The Zariskian localization
    package is proved through a survival lemma in U rather than through
    localized Rees rings. Corollary 4.4 uses a maximal-rank argument in place
    of the sketched Lemma 4.3. Supports are computed over all primes of G.
    The legacy scaffolds outside SymplecticStafford/Paper are not used by the
    proof.

review:
  status: "agent-reviewed"
  reviewers: []
  notes: >-
    The statement correspondence and proof architecture await independent
    human review. The comparator result certifies that Solution proves
    exactly the Challenge statement with the permitted axioms.

alignment:
  namespace: "SymplecticStafford"
  statements:
    - source: "Target theorem A, equation (1.4), standing hypotheses of section 1.1"
      lean: "SymplecticStafford.Paper.FilteredAlgebraData.targetA"
      module: "SymplecticStafford.Paper.Induction"
      status: "proved"
      note: >-
        For nonzero d and a and every B, proves 1 = dR + (B + Ha)dS
        in the original algebra, with no localization or source-selection premise.
    - source: "Target theorem A, independently stated Palomar comparison"
      lean: "SymplecticStaffordChallenge.universalStatement"
      module: "Solution"
      status: "proved"
      note: >-
        The Mathlib-only Challenge states the full filtered-class theorem.
        Solution repeats its definitions independently and transports targetA.
    - source: "Section 7, left-handed identity"
      lean: "SymplecticStafford.Paper.FilteredAlgebraData.targetA_left"
      module: "SymplecticStafford.Paper.Opposite"
      status: "proved"
      note: "Proves 1 = R d + S d F by applying Target A to the opposite algebra."
    - source: "Section 7, cancellation"
      lean: "SymplecticStafford.Paper.FilteredAlgebraData.cancellation"
      module: "SymplecticStafford.Paper.ConsequencesForU"
      status: "proved"
      note: >-
        Section 7 consequences are exported for U; their precise hypotheses
        and the paper/Lean correspondence are recorded in the submission scope.

acknowledgements: >-
  The active package builds on Lean and Mathlib, its only direct dependency.
  Retired scaffolds used AlgebraicAnalysis and Stafford38 in their frozen
  historical environment. The bundled Comparator tools provide the independent
  submission-checking path for the complete Target A endpoint.
